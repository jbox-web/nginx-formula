# -*- coding: utf-8 -*-
# vim: ft=yaml
---
# For help on this file's format, see https://kitchen.ci/
driver:
  name: docker
  use_sudo: false
  privileged: true
  run_command: /usr/lib/systemd/systemd

provisioner:
  name: salt_solo
  log_level: debug
  salt_install: none
  require_chef: false
  formula: nginx
  salt_copy_filter:
    - .kitchen
    - .git

transport:
  # Avoid lengthy waits when a container does not launch correctly
  max_wait_until_ready: 60

platforms:
  - name: debian-13-3008-2
    driver:
      image: saltimages/salt-3008.2-py3:debian-13
      run_command: /lib/systemd/systemd
  - name: debian-13-3006-27
    driver:
      image: saltimages/salt-3006.27-py3:debian-13
      run_command: /lib/systemd/systemd
  - name: debian-11-3006-27
    driver:
      image: saltimages/salt-3006.27-py3:debian-11
      run_command: /lib/systemd/systemd
      # bullseye-security still indexes packages purged from its pool since the
      # end of LTS (2026-08-31); production Debian 11 hosts do not use it either.
      provision_command:
        - sed -i '/bullseye-security/d' /etc/apt/sources.list && apt-get update

##########################################################
# This file is managed as part of a Copier template.     #
# Please make your own changes below this comment.       #
##########################################################

verifier:
  # https://www.inspec.io/
  name: inspec
  sudo: true
  reporter:
    # cli, documentation, html, progress, json, json-min, json-rspec, junit
    - cli

suites:
  - name: default
    provisioner:
      dependencies:
        - name: test_dep
          path: test/salt/default/states
      state_top:
        base:
          '*':
            - test_dep.create_dependency_file
            - nginx._mapdata
            - nginx
      pillars:
        top.sls:
          base:
            '*':
              - nginx
      pillars_from_files:
        nginx.sls: test/salt/default/pillar/nginx.sls
    verifier:
      inspec_tests:
        - path: test/integration/default
  - name: passenger
    includes:
      - debian-13-3008-2
      - debian-13-3006-27
      - debian-11-3006-27
    provisioner:
      state_top:
        base:
          '*':
            - nginx._mapdata
            - nginx.passenger
      pillars:
        top.sls:
          base:
            '*':
              - nginx
      pillars_from_files:
        nginx.sls: test/salt/passenger/pillar/nginx.sls
    verifier:
      inspec_tests:
        - path: test/integration/passenger
